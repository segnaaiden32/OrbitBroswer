<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080B12">
  <meta name="description" content="Orbit Search — a clearer way to explore the web.">
  <title>Orbit Search — Explore beyond the ordinary</title>
  <style>
    :root {
      --site-primary: #3478F6;
      --site-on-primary: #FFFFFF;
      --site-secondary: #172B4D;
      --site-on-secondary: #DCE9FF;
      --site-background: #080B12;
      --site-on-background: #F3F6FC;
      --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --site-font-heading: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --site-heading-scale: 1;
      --site-spacing-scale: 1;
      --site-radius-scale: 1;
      --site-decoration-opacity: 1;
      --bg: #080B12;
      --panel: #0E1420;
      --panel-2: #121B2B;
      --line: #202C40;
      --muted: #91A0B7;
      --blue: #3478F6;
      --orange: #FF914D;
      --white: #F3F6FC;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--white);
      font-family: var(--site-font-body);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    #app {
      min-height: 100vh;
      width: 100%;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      color: var(--site-on-background);
      background-color: var(--site-background);
    }

    .ambient {
      position: absolute;
      z-index: -1;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(90px);
      opacity: calc(.15 * var(--site-decoration-opacity));
      animation: drift 16s ease-in-out infinite alternate;
    }

    .ambient-a {
      width: 420px;
      height: 420px;
      top: 70px;
      left: -210px;
      background: #1458D8;
    }

    .ambient-b {
      width: 360px;
      height: 360px;
      top: 260px;
      right: -210px;
      background: #D85E27;
      animation-delay: -7s;
    }

    .grid-glow {
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      opacity: calc(.07 * var(--site-decoration-opacity));
      background-image:
        linear-gradient(#6D8DBA22 1px, transparent 1px),
        linear-gradient(90deg, #6D8DBA22 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(30px, -24px, 0) scale(1.08); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes orbit-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 7px #FF914D12, 0 0 20px #FF914D55;
      }
    }

    .topbar {
      height: 78px;
      padding: 0 clamp(20px, 5vw, 76px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #FFFFFF0D;
      background: #080B12B8;
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 2;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--white);
      text-decoration: none;
      font-weight: 780;
      letter-spacing: -1px;
      font-size: 21px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(145deg, #4388FF, #2055C8);
      box-shadow: 0 7px 24px #3478F644, inset 0 1px #FFFFFF55;
    }

    .brand-mark svg {
      width: 23px;
      height: 23px;
    }

    .brand-word span { color: var(--orange); }

    .top-right {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid #FFFFFF12;
      background: #FFFFFF06;
      border-radius: 999px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #56D6A0;
      border-radius: 50%;
      box-shadow: 0 0 0 4px #56D6A018;
    }

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: clamp(130px, 22vh, 220px) 24px 150px;
      text-align: center;
    }

    .hero { animation: rise .7s cubic-bezier(.2,.75,.25,1) both; }

    h1 {
      margin: 0 0 34px;
      font-family: var(--site-font-heading);
      font-size: calc(clamp(48px, 7vw, 76px) * var(--site-heading-scale));
      line-height: 1;
      letter-spacing: -.075em;
      font-weight: 760;
    }

    h1 .accent { color: var(--orange); }

    .search-area {
      max-width: 780px;
      margin: 0 auto;
      animation: rise .8s .12s cubic-bezier(.2,.75,.25,1) both;
    }

    .search-shell {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 9px 10px 9px 20px;
      background: linear-gradient(145deg, #141E30, #0E1522);
      border: 1px solid #3B4D6A;
      border-radius: calc(20px * var(--site-radius-scale));
      box-shadow: 0 18px 65px #00000066, inset 0 1px #FFFFFF0D;
      transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
    }

    .search-shell:focus-within {
      border-color: #4C8CFF;
      box-shadow: 0 0 0 4px #3478F626, 0 22px 70px #00000070;
      transform: translateY(-2px);
    }

    .search-icon {
      width: 22px;
      height: 22px;
      color: #8296B6;
      flex: none;
    }

    #query, #resultsQuery {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--white);
      font-size: 16px;
      padding: 13px 0;
    }

    #query::placeholder, #resultsQuery::placeholder {
      color: #7586A1;
    }

    .clear {
      display: none;
      border: 0;
      background: transparent;
      color: #8FA0BA;
      cursor: pointer;
      font-size: 21px;
      padding: 5px;
      transition: color .2s;
    }

    .clear:hover { color: var(--orange); }

    .search-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 13px;
      padding: 14px 21px;
      color: #10141D;
      background: linear-gradient(135deg, #FFAD70, #FF8745);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 20px #FF914D2B;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .search-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 28px #FF914D45;
      filter: saturate(1.08);
    }

    .search-button:active { transform: translateY(0) scale(.98); }

    .search-button svg {
      width: 15px;
      height: 15px;
    }

    .explore-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 34px;
    }

    .explore-label {
      margin-right: 5px;
      color: #71819A;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .14em;
    }

    .topic {
      border: 1px solid #FFFFFF13;
      border-radius: 999px;
      padding: 9px 14px;
      color: #AAB9CF;
      background: #FFFFFF05;
      font-size: 12px;
      cursor: pointer;
      transition: color .22s, border-color .22s, background .22s, transform .22s;
    }

    .topic:hover {
      color: #FFFFFF;
      border-color: #FF914D66;
      background: #FF914D12;
      transform: translateY(-2px);
    }

    .footer {
      padding: 22px clamp(20px, 5vw, 76px);
      border-top: 1px solid #FFFFFF0D;
      color: #C9D6EA;
      background: #080B12A8;
      font-size: 13px;
      letter-spacing: -.03em;
    }

    .footer .orange { color: var(--orange); }

    .results-page {
      display: none;
      max-width: 1160px;
      margin: 0 auto;
      padding: 30px clamp(20px, 5vw, 56px) 80px;
      text-align: left;
      animation: rise .4s ease both;
    }

    .results-top {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .results-top .brand { flex: none; }

    .results-search {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 760px;
    }

    .results-search .search-shell {
      flex: 1;
      min-width: 0;
      padding-left: 17px;
    }

    .results-search .search-button { padding: 13px 17px; }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      padding: 11px 0;
      margin: 13px 0 12px;
      background: transparent;
      color: #9FB1CB;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: color .2s, transform .2s;
    }

    .back-home:hover {
      color: var(--orange);
      transform: translateX(-3px);
    }

    .results-meta {
      margin: 24px 0 16px;
      color: #8394AE;
      font-size: 12px;
    }

    .result-layout {
      display: block;
      max-width: 900px;
    }

    /* Keep Google's injected result area visually integrated with Orbit. */
    #orbitGoogleResults {
      min-height: 160px;
      color: var(--white);
    }

    #orbitGoogleResults .gsc-control-cse,
    #orbitGoogleResults .gsc-control-cse-en {
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
    }

    #orbitGoogleResults .gsc-webResult.gsc-result,
    #orbitGoogleResults .gsc-results .gsc-imageResult {
      padding: 17px 0 !important;
      border: 0 !important;
      border-bottom: 1px solid #FFFFFF12 !important;
      background: transparent !important;
    }

    #orbitGoogleResults .gs-title,
    #orbitGoogleResults .gs-title * {
      color: #8DB5FF !important;
    }

    #orbitGoogleResults .gs-snippet,
    #orbitGoogleResults .gs-visibleUrl {
      color: #A5B4C9 !important;
    }

    #orbitGoogleResults .gsc-cursor-box { margin-top: 20px !important; }
    #orbitGoogleResults .gsc-cursor-page { color: #FFAD78 !important; }

    #orbitGoogleResults .gsc-results .gsc-cursor-box .gsc-cursor-current-page {
      color: #FFFFFF !important;
      background: #3478F6 !important;
    }

    #orbitGoogleResults .gsc-table-result,
    #orbitGoogleResults .gsc-thumbnail-inside,
    #orbitGoogleResults .gsc-url-top {
      background: transparent !important;
    }

    #orbitGoogleResults .gsc-result-info { color: #8292AA !important; }
    #orbitGoogleResults .gcsc-more-maybe-branding-root { opacity: .65; }

    @media (max-width: 720px) {
      .topbar {
        height: 68px;
        padding: 0 19px;
      }

      .top-right .status { display: none; }

      main {
        padding-top: 24vh;
        padding-bottom: 100px;
      }

      h1 { letter-spacing: -.065em; }

      .search-shell {
        padding-left: 14px;
        gap: 9px;
      }

      .search-button { padding: 13px 15px; }

      .results-top {
        align-items: flex-start;
        flex-direction: column;
        gap: 16px;
      }

      .results-search { width: 100%; }
      .results-search .search-shell { width: 100%; }
    }

    @media (max-width: 430px) {
      .brand { font-size: 19px; }
      h1 { font-size: 48px; }

      .search-shell {
        gap: 7px;
        padding: 7px 7px 7px 12px;
      }

      #query { font-size: 14px; }

      .search-button {
        padding: 12px 12px;
        font-size: 12px;
      }

      .explore-row { gap: 7px; }
      .topic { padding: 8px 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>
    <div class="grid-glow" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="#" id="homeBrand" aria-label="Orbit Search home">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="6.8" stroke="currentColor" stroke-width="1.7"/>
            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-32 12 12)" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="17.7" cy="7.4" r="1.5" fill="#FFAD70"/>
          </svg>
        </span>
        <span class="brand-word">orbit<span>.</span></span>
      </a>

      <div class="top-right">
        <span class="status">
          <span class="status-dot"></span>
          WEB SEARCH
        </span>
      </div>
    </header>

    <main id="homePage">
      <section class="hero">
        <h1>Explore<span class="accent">.</span></h1>
      </section>

      <div class="search-area">
        <form id="searchForm" class="search-shell">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/>
            <path d="m16 16 4.3 4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>

          <input
            id="query"
            type="search"
            placeholder="What do you want to discover?"
            autocomplete="off"
            aria-label="Search the web"
          >

          <button class="clear" id="clearBtn" type="button" aria-label="Clear search">×</button>

          <button class="search-button" type="submit">
            Search
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 13 13 3M4 3h9v9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>

        <div class="explore-row">
          <span class="explore-label">EXPLORE</span>
          <button type="button" class="topic">Technology</button>
          <button type="button" class="topic">Space</button>
          <button type="button" class="topic">Design</button>
          <button type="button" class="topic">Nature</button>
          <button type="button" class="topic">History</button>
        </div>
      </div>
    </main>

    <section class="results-page" id="resultsPage" aria-live="polite">
      <div class="results-top">
        <a class="brand" href="#" id="resultsBrand" aria-label="Orbit Search home">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="6.8" stroke="currentColor" stroke-width="1.7"/>
              <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-32 12 12)" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="17.7" cy="7.4" r="1.5" fill="#FFAD70"/>
            </svg>
          </span>
          <span class="brand-word">orbit<span>.</span></span>
        </a>

        <form id="resultsForm" class="results-search">
          <div class="search-shell">
            <input
              id="resultsQuery"
              type="search"
              placeholder="Search the web..."
              autocomplete="off"
              aria-label="Search again"
            >
            <button class="search-button" type="submit">Search ↗</button>
          </div>
        </form>
      </div>

      <button class="back-home" id="backHome" type="button">← Home</button>
      <div class="results-meta" id="resultsMeta"></div>

      <div class="result-layout">
        <div id="orbitGoogleResults"></div>
      </div>
    </section>

    <footer class="footer">
      <strong>orbit<span class="orange">.</span></strong>
    </footer>
  </div>

  <script>
    window.orbitPendingQuery = '';
    window.orbitGoogleReady = false;

    window.__gcse = {
      parsetags: 'explicit',

      initializationCallback: function () {
        google.search.cse.element.render({
          div: 'orbitGoogleResults',
          tag: 'searchresults-only',
          gname: 'orbitResults'
        });

        window.orbitGoogleReady = true;

        if (window.orbitPendingQuery) {
          google.search.cse.element
            .getElement('orbitResults')
            .execute(window.orbitPendingQuery);
        }
      }
    };
  </script>

  <!-- Google Programmable Search Engine -->
  <script async src="https://cse.google.com/cse.js?cx=2636715d83cc44e9e"></script>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('query');
    const clearBtn = document.getElementById('clearBtn');
    const homePage = document.getElementById('homePage');
    const resultsPage = document.getElementById('resultsPage');
    const resultsQuery = document.getElementById('resultsQuery');
    const resultsMeta = document.getElementById('resultsMeta');

    function updateClear() {
      clearBtn.style.display = input.value ? 'block' : 'none';
    }

    function showResults(query) {
      homePage.style.display = 'none';
      resultsPage.style.display = 'block';

      resultsQuery.value = query;
      resultsMeta.textContent = `Results for “${query}”`;

      window.orbitPendingQuery = query;

      if (window.orbitGoogleReady) {
        const element = google.search.cse.element.getElement('orbitResults');

        if (element) {
          element.execute(query);
        }
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    input.addEventListener('input', updateClear);

    clearBtn.addEventListener('click', () => {
      input.value = '';
      updateClear();
      input.focus();
    });

    document.querySelectorAll('.topic').forEach((button) => {
      button.addEventListener('click', () => {
        input.value = button.textContent;
        updateClear();
        input.focus();
      });
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const query = input.value.trim();

      if (!query) {
        input.focus();
        return;
      }

      showResults(query);
    });

    document.getElementById('resultsForm').addEventListener('submit', (event) => {
      event.preventDefault();

      const query = resultsQuery.value.trim();

      if (query) {
        showResults(query);
      }
    });

    function goHome() {
      resultsPage.style.display = 'none';
      homePage.style.display = 'block';

      input.value = resultsQuery.value;
      updateClear();

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('backHome').addEventListener('click', goHome);

    document.getElementById('homeBrand').addEventListener('click', (event) => {
      event.preventDefault();
      goHome();
    });

    document.getElementById('resultsBrand').addEventListener('click', (event) => {
      event.preventDefault();
      goHome();
    });
  </script>
</body>
</html>
